name: benchmarks

# The benchmarks (benchmarks/, pixi run bench) for every architecture x
# browser, main thread + worker. The results are shown on the summary page of
# each job (benchmarks/report.py) and uploaded as json. CI runners are shared
# and noisy: compare the rows of one run, not absolute numbers across runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# a new run (push / PR update) cancels the older run of the same workflow on
# the same branch / PR (release tags: each tag its own group, never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench ${{ matrix.wasm }} / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        wasm: [wasm32, wasm64]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      - name: Install the browser
        run: pixi run playwright install --with-deps ${{ matrix.browser }}

      - name: Run the benchmarks (main thread + worker)
        run: pixi run bench ${{ matrix.wasm }} ${{ matrix.browser }}

      # (a fresh runner: the json files of this run only)
      - name: Report
        if: always()
        run: |
          shopt -s nullglob
          results=(build_root/benchmarks/${{ matrix.wasm }}/*.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "no benchmark results" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 benchmarks/report.py "${results[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.wasm }}-${{ matrix.browser }}
          path: build_root/benchmarks/${{ matrix.wasm }}/
          if-no-files-found: ignore
