name: docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # build (but do not deploy) the docs for pull requests
  pull_request:


# a new run (push / PR update) cancels the older run of the same workflow on
# the same branch / PR (release tags: each tag its own group, never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}


jobs:

  build_pyjs_docs:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # creates (and caches) the dev env (incl. sphinx),
      # build_local.sh uses it via BUILD_ENV_PREFIX
      - name: Install micromamba and the dev env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-dev.yml
          environment-name: pyjs-build
          cache-environment: true
          init-shell: bash

      # builds the npm package (wasm32 + wasm64, deployed next to the html for
      # the playground) and the sphinx docs
      - name: Build the docs
        run: |
          export BUILD_ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/pyjs-build"
          export DOCS_OUT_DIR="$GITHUB_WORKSPACE/docs_build/html"
          ./build_local.sh docs

      ################################################################
      # upload to github pages
      ################################################################
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_build/html


  deploy:
    # only run on main branch
    if: github.ref == 'refs/heads/main' && github.repository == 'emscripten-forge/pyjs'

    # Add a dependency to the build job
    needs: build_pyjs_docs

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read   # to read the Pages artifact
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
