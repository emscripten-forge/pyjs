name: docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # build (but do not deploy) the docs for pull requests
  pull_request:


defaults:
  run:
    shell: bash -l {0}


jobs:

  build_pyjs_docs:

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # creates (and caches) the build env (incl. sphinx / jupyterlite),
      # build_local.sh uses it via BUILD_ENV_PREFIX
      - name: Install micromamba and the build env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-wasm-build-wasm32.yml
          environment-name: pyjs-build
          cache-environment: true
          init-shell: bash

      # builds pyjs, xeus-python (from source, against this pyjs) for wasm32 and
      # wasm64 (build_local.sh creates the wasm64 build env itself) and the
      # sphinx docs with jupyterlite, then smoke tests the docs in a headless
      # browser (pyjs in the xeus-python kernels and the javascript kernel with
      # the wasm32 and the wasm64 pyjs runtime)
      - name: Build and test the docs
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps
        run: |
          export BUILD_ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/pyjs-build"
          export DOCS_OUT_DIR="$GITHUB_WORKSPACE/docs_build/html"
          ./build_local.sh wasm32 --docs --test

      ################################################################
      # upload to github pages
      ################################################################
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_build/html


  deploy:
    # only run on main branch
    if: github.ref == 'refs/heads/main' && github.repository == 'emscripten-forge/pyjs'

    # Add a dependency to the build job
    needs: build_pyjs_docs

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read   # to read the Pages artifact
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
