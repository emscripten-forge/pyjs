name: CI

on:
  workflow_dispatch:
  push:
  pull_request:


# a new run (push / PR update) cancels the older run of the same workflow on
# the same branch / PR (release tags: each tag its own group, never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  test-browser:
    name: test ${{ matrix.wasm }} / ${{ matrix.browser }}

    runs-on: ubuntu-latest
    # a failed JSPI suspension can hang the browser instead of failing
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        wasm: [wasm32, wasm64]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      # pixi + the default (dev) environment from pixi.lock, cached; the
      # emscripten environments are installed by the tasks
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true

      # the browser + the system libraries it needs (apt)
      - name: Install the browser
        run: pixi run playwright install --with-deps ${{ matrix.browser }}

      # one build for all browsers: JSPI (pyjs.run_sync) is used when the browser
      # supports it (needs python with the wasm-gc call trampoline,
      # emscripten-forge python >= build 6)
      - name: Build and test (browser main thread + worker)
        run: pixi run test ${{ matrix.wasm }} ${{ matrix.browser }}

      # the same build, JSPI switched off at runtime (like a browser without JSPI)
      - name: Test without JSPI (browser main thread + worker)
        run: pixi run test ${{ matrix.wasm }} ${{ matrix.browser }} "main worker" default off

      - name: Test without numpy (browser main thread)
        run: pixi run test ${{ matrix.wasm }} ${{ matrix.browser }} main no-numpy
