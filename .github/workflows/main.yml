name: CI

on:
  workflow_dispatch:
  push:
  pull_request:


defaults:
  run:
    shell: bash -l {0}


env:
  # pyjs-code-runner is installed from source (see build_local.sh)
  PYJS_CODE_RUNNER_REF: "3.3.0"


jobs:

  test-browser:
    name: test ${{ matrix.wasm }} / ${{ matrix.browser }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        wasm: [wasm32, wasm64]
        browser: [chromium, firefox, webkit]

    env:
      BROWSERS: ${{ matrix.browser }}
      # install the system libraries the browser needs (via apt)
      PLAYWRIGHT_INSTALL_ARGS: --with-deps
      PYJS_CODE_RUNNER_DIR: ${{ github.workspace }}/../pyjs-code-runner

    steps:
      - uses: actions/checkout@v4

      # creates (and caches) the build env, build_local.sh uses it via
      # BUILD_ENV_PREFIX and creates the (small) host / deploy envs itself
      - name: Install micromamba and the build env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-wasm-build-${{ matrix.wasm }}.yml
          environment-name: pyjs-build
          cache-environment: true
          init-shell: bash

      - name: Get pyjs-code-runner
        run: |
          git clone --depth 1 --branch "$PYJS_CODE_RUNNER_REF" \
            https://github.com/emscripten-forge/pyjs-code-runner \
            "$PYJS_CODE_RUNNER_DIR"

      - name: Build and test (browser main thread + worker)
        run: |
          export BUILD_ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/pyjs-build"
          ./build_local.sh ${{ matrix.wasm }} --test

      - name: Test without numpy (browser main thread)
        env:
          DEPLOY_ENV_FILE: ${{ github.workspace }}/environment-wasm-deploy-no-numpy.yml
          BACKENDS: browser-main
        run: |
          export BUILD_ENV_PREFIX="$MAMBA_ROOT_PREFIX/envs/pyjs-build"
          ./build_local.sh ${{ matrix.wasm }} --test
