<!doctype html>
<html>
<head><meta charset="utf-8"><title>pyjs npm smoke test</title></head>
<body>
<pre id="out">running</pre>
<script type="module">
// ?entry=index|wasm32|wasm64 &mode=main|worker &network=0|1 &pkg=<url of the package dir>
const params = new URLSearchParams(location.search);
const show = (result) => {
  window.__result = result;
  document.getElementById("out").textContent = JSON.stringify(result, null, 2);
};
try {
  if (params.get("mode") === "worker") {
    const worker = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });
    worker.onmessage = (e) => show(e.data);
    worker.onerror = (e) => show({ ok: false, error: `worker error: ${e.message}` });
    worker.postMessage(Object.fromEntries(params));
  } else {
    const { run } = await import("./test.js");
    show(await run(Object.fromEntries(params)));
  }
} catch (e) {
  show({ ok: false, error: String(e && e.stack || e) });
}
</script>
</body>
</html>
