name: pyjs-dev
# the single development env (native, for wasm32 and wasm64): build_local.sh
# creates it as build_root/dev_prefix (CI: setup-micromamba, BUILD_ENV_PREFIX)
channels:
  - conda-forge
  - https://repo.prefix.dev/emscripten-forge/6x


dependencies:
  - python =3.14
  - cmake
  # emscripten itself; the wasm32 / wasm64 specific flags (-m64) are set by
  # build_local.sh (instead of emscripten_emscripten-wasm32 / -wasm64, which
  # only depend on emscripten-core and add -m64 for wasm64 in their activation)
  - emscripten-core == 6.0.8
  # packs conda envs for the browser (test pages, npm package)
  - empack >=6.0.0
  # npm package build, bundler test pages
  - nodejs
  # pyjs_test_driver: playwright = driver + browsers, playwright-python = its
  # python API
  - playwright
  - playwright-python
  # documentation
  - sphinx
  - sphinx-autoapi
  - myst-parser
  - pydata-sphinx-theme
