name: pyjs-host
# the emscripten env pyjs is built against and installed into, created per
# architecture by build_local.sh (build_root/host_prefix_<wasm>, platform
# emscripten-wasm32 / emscripten-wasm64).
channels:
  - conda-forge
  - https://repo.prefix.dev/emscripten-forge/6x

dependencies:
  - libpython-static
  - python
  - pybind11
  - emscripten-abi==6.0.8
  - numpy
  - zlib-static
  - libsqlite-static
  - libbzip2-static
  - zstd-static
  # archive extraction in the runtime (src/extract.cpp; only tar / zip and
  # gzip / bzip2 / zstd are enabled, libxml2 is not linked)
  - libarchive-static
