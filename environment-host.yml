name: pyjs-host
# the emscripten env pyjs is built against and installed into, created per
# architecture by build_local.sh (build_root/host_prefix_<wasm>, platform
# emscripten-wasm32 / emscripten-wasm64). Only used for building, so it also
# contains what `build_local.sh docs` needs to build xeus-python from source (the docs
# kernel, built against the pyjs from this repository: no pyjs / pyjs-dev /
# libpyjs-static packages here).
channels:
  - conda-forge
  - https://repo.prefix.dev/emscripten-forge/6x

dependencies:
  - libpython-static
  - python
  - pybind11
  - emscripten-abi==6.0.8
  - numpy
  - zlib-static
  - libsqlite-static
  - libbzip2-static
  # docs: xeus-python (build / run requirements of the emscripten-forge
  # xeus-python recipe, without pyjs)
  - nlohmann_json
  - nlohmann_json-abi
  - xeus
  - xeus-lite-static >=5.0.0
  - pybind11_json
  - xtl
  - xeus-python-shell-lite >=0.8,<0.9
