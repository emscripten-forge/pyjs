name: pyjs-wasm-deploy
channels:
  - conda-forge
  - https://repo.prefix.dev/emscripten-forge/6x

dependencies:
  - python
  - emscripten-abi==6.0.8
  - numpy
  - pytest
  # http stack (tests/tests/test_http.py): what scipy.datasets uses to download
  - urllib3
  - requests
  - pyodide-http
  - pooch
  # httpx2 (tests/atests/httpx_tests.py); its pyjs fetch transport
  # httpx2-jsfetch is mounted from a git checkout by build_local.sh (the conda
  # package would also pull in the pyjs package)
  - httpx2
