name: pyjs-wasm-docs
channels:
  - conda-forge
  - https://repo.prefix.dev/emscripten-forge/6x

# extra packages for the docs host env (used together with environment-wasm.yml,
# see build_local.sh --docs): xeus-python is built from source against the
# pyjs build from this repo and serves as the kernel of the docs jupyterlite.
# (build / run requirements of the emscripten-forge xeus-python recipe,
# without pyjs / pyjs-dev)
dependencies:
  - nlohmann_json
  - nlohmann_json-abi
  - xeus
  - xeus-lite-static >=5.0.0
  - pybind11_json
  - xtl
  - xeus-python-shell-lite >=0.8,<0.9
  # httpx2 in the docs kernels; its fetch transport httpx2_jsfetch is mounted
  # from a git checkout (the conda package would pull in the pyjs package),
  # see build_local.sh / docs/conf.py
  - httpx2
