# Build, test and benchmark pyjs, build the npm package and the docs:
#
#   pixi run build wasm32                       # build pyjs (wasm32 | wasm64 | "wasm32 wasm64")
#   pixi run test wasm32                        # + npm package (this arch), tests in the browser
#   pixi run test wasm64 "chromium firefox webkit"
#   pixi run test wasm32 chromium "main worker" no-jspi       # JSPI switched off
#   pixi run bench wasm32                       # benchmarks (bench wasm32 chromium "main worker" async)
#   pixi run bench-pyodide                      # the same benchmarks on pyodide (the reference)
#   pixi run npm-package                        # the npm package (wasm32 + wasm64)
#   pixi run test-npm                           # + its test (both archs, lock CLI)
#   pixi run test-bundlers                      # apps bundled around the package
#   pixi run docs                               # npm package + sphinx docs
#   pixi run docs-serve                         # docs: rebuild on change + live reload
#   pixi task list                              # all tasks
#
# Environments (in .pixi/envs/): `default` = the native tools (emscripten,
# cmake, node, playwright, sphinx); `host-<arch>` = what pyjs is built against;
# `npm-env-<arch>` = the python shipped in the npm package. The emscripten
# environments cannot run here: the task `envs` installs them with
# `pixi install --platform`. Build output: build_root/ (not in git).
[workspace]
name = "pyjs"
# emscripten-forge 6x (emscripten 6.0.8), first: its emscripten builds win.
# A local recipe build (rattler-build output dir) goes in front of it.
channels = ["https://repo.prefix.dev/emscripten-forge/6x", "conda-forge"]
# (emscripten-core 6.0.8 of the 6x channel: no osx-64 build)
platforms = ["osx-arm64", "linux-64", "emscripten-wasm32", "emscripten-wasm64"]
requires-pixi = ">=0.84"

########################################
# environments
########################################
# the native tools, one environment for wasm32 and wasm64
[feature.dev]
platforms = ["osx-arm64", "linux-64"]
channels = ["conda-forge", "https://repo.prefix.dev/emscripten-forge/6x"]

[feature.dev.dependencies]
python = "3.14.*"
cmake = "*"
# emscripten itself; -m64 for wasm64 is added by the tasks (that is all the
# emscripten_emscripten-wasm64 package would add)
emscripten-core = "==6.0.8"
# packs conda envs for the browser (npm package)
empack = ">=6.0.0"
# npm package, bundler test pages
nodejs = "*"
# bundles the JavaScript side of libpyjs (src/js)
esbuild = "*"
# pyjs_test_driver: playwright (driver + browsers) + its python API
playwright = "*"
playwright-python = "*"
# GitHub CLI (PRs, reviews, CI runs)
gh = "*"
# documentation
sphinx = "*"
sphinx-autoapi = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
# the diagrams of docs/design.md (```{mermaid} blocks)
sphinxcontrib-mermaid = "*"
# rebuild + live reload while writing docs (task docs-serve)
sphinx-autobuild = "*"

[feature.dev.activation.env]
# = the python of the host environments (paths in the env, cmake)
PY_VER = "3.14"

# what pyjs is built against (incl. libarchive-static for src/extract.cpp)
[feature.host.dependencies]
python = "3.14.*"
libpython-static = "*"
# headers + sources, compiled into libpyjs
nanobind = "*"
emscripten-abi = "==6.0.8"
numpy = "*"
zlib-static = "*"
libsqlite-static = "*"
libbzip2-static = "*"
zstd-static = "*"
# archive extraction in the runtime (only tar / zip, gzip / bzip2 / zstd are
# enabled, libxml2 is not linked)
libarchive-static = "*"

# the python + stdlib of the npm package (pip / ca-certificates: as in the
# environments micromamba created before)
[feature.npm-env.dependencies]
python = "3.14.*"
# with the split python recipe (python-core + python-ssl, ...) also
# `python-test-modules = "3.14.*"`: the test pages ask for it (option
# `stdlib`, shipped as optional; not a package of the unsplit python)
emscripten-abi = "==6.0.8"
pip = "*"
ca-certificates = "*"

[feature.wasm32]
platforms = ["emscripten-wasm32"]

[feature.wasm64]
platforms = ["emscripten-wasm64"]

[environments]
default = ["dev"]
host-wasm32 = { features = ["host", "wasm32"], no-default-feature = true }
host-wasm64 = { features = ["host", "wasm64"], no-default-feature = true }
npm-env-wasm32 = { features = ["npm-env", "wasm32"], no-default-feature = true }
npm-env-wasm64 = { features = ["npm-env", "wasm64"], no-default-feature = true }

########################################
# tasks (all in the default environment). `archs`: one or both architectures
# ("wasm32 wasm64"), the steps loop over them.
########################################
[tasks.envs]
description = "Install the emscripten environments (host + npm python) of the archs"
args = [{ arg = "archs", default = "wasm32 wasm64" }]
cmd = '''
set -e
{% for arch in archs | split %}
pixi install -e host-{{ arch }} --platform emscripten-{{ arch }}
pixi install -e npm-env-{{ arch }} --platform emscripten-{{ arch }}
{% endfor %}
'''

# cmake: -m64 for wasm64 must be in CMAKE_C_FLAGS on the command line (the
# toolchain file decides 32 / 64 bit from it, before the environment's CFLAGS)
# and in EMCC_CFLAGS (every emcc call, e.g. the ports). The libraries are
# linked from CMAKE_INSTALL_PREFIX (= the host env; nothing is installed).
[tasks.configure]
description = "Configure the cmake build of pyjs (build_root/build_<arch>)"
args = [{ arg = "archs", default = "wasm32 wasm64" }]
depends-on = [{ task = "envs", args = ["{{ archs }}"] }]
cmd = '''
set -e
{% for arch in archs | split %}
EMCC_CFLAGS="$EMCC_CFLAGS{% if arch == 'wasm64' %} -m64{% endif %}" emcmake cmake -S . -B build_root/build_{{ arch }} \
    -DCMAKE_BUILD_TYPE=Release \
    -DCMAKE_PREFIX_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/host-{{ arch }} \
    -DCMAKE_FIND_ROOT_PATH=$PIXI_PROJECT_ROOT/.pixi/envs/host-{{ arch }} \
    -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ON \
    -DCMAKE_INSTALL_PREFIX=$PIXI_PROJECT_ROOT/.pixi/envs/host-{{ arch }} \
    {% if arch == 'wasm64' %}-DCMAKE_C_FLAGS=-m64 -DCMAKE_CXX_FLAGS=-m64 -DWASM64=TRUE{% else %}-DWASM64=FALSE{% endif %} \
    -DPY_VERSION=$PY_VER
{% endfor %}
'''

[tasks.build]
description = "Build pyjs: build_root/build_<arch>/pyjs_runtime_browser.{js,wasm} + libpyjs.a"
args = [{ arg = "archs", default = "wasm32 wasm64" }]
depends-on = [{ task = "configure", args = ["{{ archs }}"] }]
cmd = '''
set -e
{% for arch in archs | split %}
EMCC_CFLAGS="$EMCC_CFLAGS{% if arch == 'wasm64' %} -m64{% endif %}" cmake --build build_root/build_{{ arch }} --parallel
{% endfor %}
'''

# per arch build_root/npm/stage/<arch>/: the runtime + python / stdlib (empack,
# npm/empack_config.yaml drops CPython's test suite etc.) + the pyjs module of
# this repository + the channels / python version for mambajs
[tasks.pack]
description = "Stage the runtime + the packed python env of the npm package"
args = [{ arg = "archs", default = "wasm32 wasm64" }]
depends-on = [{ task = "build", args = ["{{ archs }}"] }]
cmd = '''
set -e
{% for arch in archs | split %}
rm -rf build_root/npm/stage/{{ arch }}
mkdir -p build_root/npm/stage/{{ arch }}
cp build_root/build_{{ arch }}/pyjs_runtime_browser.js build_root/build_{{ arch }}/pyjs_runtime_browser.wasm build_root/npm/stage/{{ arch }}/
empack pack env --env-prefix $PIXI_PROJECT_ROOT/.pixi/envs/npm-env-{{ arch }} --relocate-prefix / \
    --outdir build_root/npm/stage/{{ arch }} --config npm/empack_config.yaml --no-use-cache
empack pack dir --host-dir module/pyjs --mount-dir /lib/python$PY_VER/site-packages/pyjs \
    --outname pyjs_module.tar.gz --outdir build_root/npm/stage/{{ arch }}
empack pack append --env-meta build_root/npm/stage/{{ arch }}/empack_env_meta.json \
    --tarfile build_root/npm/stage/{{ arch }}/pyjs_module.tar.gz
python build_utils/npm_env_meta.py build_root/npm/stage/{{ arch }}/empack_env_meta.json \
    https://repo.prefix.dev/emscripten-forge/6x conda-forge
python build_utils/third_party_licenses.py build_root/npm/stage/{{ arch }}/THIRD_PARTY_LICENSES.md \
    --linked $PIXI_PROJECT_ROOT/.pixi/envs/host-{{ arch }} --shipped $PIXI_PROJECT_ROOT/.pixi/envs/npm-env-{{ arch }} \
    --emscripten $CONDA_PREFIX/opt/emsdk/upstream/emscripten
{% endfor %}
'''

[tasks.npm-ci]
description = "Install the build tooling of the npm package (npm/node_modules)"
cwd = "npm"
cmd = "npm ci --no-audit --no-fund"
inputs = ["npm/package-lock.json"]
outputs = ["npm/node_modules/.package-lock.json"]

# name: $NPM_PACKAGE_NAME (default @derthorsten/pyjs), version: CMakeLists.txt
[tasks.npm-package]
description = "The npm package: build_root/npm/package/ + build_root/npm/tgz/*.tgz"
args = [{ arg = "archs", default = "wasm32 wasm64" }]
depends-on = [{ task = "pack", args = ["{{ archs }}"] }, "npm-ci"]
cmd = '''
set -e
node npm/build.mjs --out build_root/npm/package {% for arch in archs | split %}--stage {{ arch }}=build_root/npm/stage/{{ arch }} {% endfor %}
rm -rf build_root/npm/tgz
mkdir -p build_root/npm/tgz
npm pack ./build_root/npm/package --pack-destination build_root/npm/tgz
echo "npm package: build_root/npm/package (publish: npm publish ./build_root/npm/tgz/*.tgz --access public)"
'''

[tasks.npm-js]
description = "Only the JavaScript of the npm package (what the conda package ships in lib_js/pyjs/npm): build_root/npm/js/"
depends-on = ["npm-ci"]
cmd = "node npm/build.mjs --js-only --out build_root/npm/js"

[tasks.browsers]
description = "Install the playwright browsers (no-op if present)"
args = [{ arg = "browsers", default = "chromium" }]
cmd = "playwright install {{ browsers }}"

# the packages the tests install at runtime (pytest runs them; the others are
# the http stack tests/test_http.py checks, as used by e.g. scipy.datasets)
[tasks.test-page]
description = "The test page of the npm package (build_root/pages/npm_<arch>)"
args = [{ arg = "arch", choices = ["wasm32", "wasm64"] }]
cmd = '''
python -m pyjs_test_driver build-page npm --package build_root/npm/package --arch {{ arch }} \
    --packages numpy pytest urllib3 requests pyodide-http pooch \
    --out build_root/pages/npm_{{ arch }}
'''

# Runs the tests on the npm package that is already in build_root/npm/package,
# without building anything (`test` = build + this; the CI builds once and
# runs this in every test job).
# The npm pages need the network (test packages from prefix.dev): a failed
# setup is retried, failed tests never are.
[tasks.run-tests]
description = "Run the test suite on the built npm package (no build): run-tests <arch> [browsers] [modes] [jspi|no-jspi]"
args = [
  { arg = "arch", choices = ["wasm32", "wasm64"] },
  { arg = "browsers", default = "chromium" },
  { arg = "modes", default = "main worker" },
  { arg = "jspi", default = "jspi", choices = ["jspi", "no-jspi"] },
]
depends-on = [
  { task = "test-page", args = ["{{ arch }}"] },
  { task = "browsers", args = ["{{ browsers }}"] },
]
cmd = '''
python -m pyjs_test_driver run build_root/pages/npm_{{ arch }} --label "npm {{ arch }}" \
    --browser {{ browsers }} --mode {{ modes }} --retries 5 {% if jspi == "no-jspi" %}--disable-jspi{% endif %}
'''

[tasks.test]
description = "Build the npm package of an arch, run the test suite on it: test <arch> [browsers] [modes] [jspi|no-jspi]"
args = [
  { arg = "arch", choices = ["wasm32", "wasm64"] },
  { arg = "browsers", default = "chromium" },
  { arg = "modes", default = "main worker" },
  { arg = "jspi", default = "jspi", choices = ["jspi", "no-jspi"] },
]
depends-on = [
  { task = "npm-package", args = ["{{ arch }}"] },
  { task = "run-tests", args = ["{{ arch }}", "{{ browsers }}", "{{ modes }}", "{{ jspi }}"] },
]

[tasks.test-lock]
description = "The lock CLI of the npm package: solve a small package against the real channels"
cmd = '''
set -e
node build_root/npm/package/bin/pyjs.mjs lock tabulate -o build_root/npm/lock_test.json
python build_utils/check_lock.py build_root/npm/lock_test.json
'''

# The bundled app does not depend on the browser: chromium, main thread.
# Needs the packed package (pixi run npm-package). Not part of test-npm: it
# tests the packaging, not pyjs itself, and takes long (the CI runs it as a
# job of its own, next to the test jobs).
[tasks.test-bundlers]
description = "Apps built with vite / webpack / rollup / esbuild / parcel around the packed npm package"
depends-on = [{ task = "browsers", args = ["chromium"] }]
cmd = '''
set -e
{% for bundler in ["vite", "webpack", "rollup", "esbuild", "parcel"] %}
python -m pyjs_test_driver build-page {{ bundler }} --tgz build_root/npm/tgz \
    --packages numpy pytest urllib3 requests pyodide-http pooch \
    --work-dir build_root/pages/bundler_projects --out build_root/pages/{{ bundler }}
python -m pyjs_test_driver run build_root/pages/{{ bundler }} --browser chromium --mode main --retries 5
{% endfor %}
'''

[tasks.test-npm]
description = "The npm package (wasm32 + wasm64) and its test: both archs, the lock CLI (bundlers: test-bundlers)"
args = [{ arg = "browsers", default = "chromium firefox webkit" }]
depends-on = [
  { task = "npm-package", args = ["wasm32 wasm64"] },
  { task = "run-tests", args = ["wasm32", "{{ browsers }}"] },
  { task = "run-tests", args = ["wasm64", "{{ browsers }}"] },
  "test-lock",
]

# results: build_root/benchmarks/<arch>/<time>_<browser>_<mode>.json
[tasks.bench]
description = "Benchmarks on the npm package of an arch: bench <arch> [browsers] [modes] [filter]"
args = [
  { arg = "arch", choices = ["wasm32", "wasm64"] },
  { arg = "browsers", default = "chromium" },
  { arg = "modes", default = "main worker" },
  { arg = "filter", default = "" },
]
depends-on = [
  { task = "npm-package", args = ["{{ arch }}"] },
  { task = "test-page", args = ["{{ arch }}"] },
  { task = "browsers", args = ["{{ browsers }}"] },
]
cmd = '''
python -m pyjs_test_driver run build_root/pages/npm_{{ arch }} --label "bench {{ arch }}" --entry benchmarks \
    --browser {{ browsers }} --mode {{ modes }} --retries 5 --option "filter={{ filter }}" \
    --result-json build_root/benchmarks/{{ arch }}/$(date +%Y%m%d-%H%M%S)_{browser}_{mode}.json \
    --meta wasm_type={{ arch }} --meta git_rev=$(git rev-parse --short HEAD) --meta timestamp=$(date +%Y%m%d-%H%M%S)
'''

# the reference: the same benchmarks on pyodide (wasm32 only). The pyodide
# release is downloaded once into build_root/pyodide/<version>/ and served
# from there.
# results: build_root/benchmarks/pyodide/<time>_<browser>_<mode>.json
[tasks.bench-pyodide]
description = "The benchmarks on pyodide (the reference): bench-pyodide [browsers] [modes] [filter] [version]"
args = [
  { arg = "browsers", default = "chromium" },
  { arg = "modes", default = "main worker" },
  { arg = "filter", default = "" },
  { arg = "version", default = "314.0.8" },
]
depends-on = [{ task = "browsers", args = ["{{ browsers }}"] }]
cmd = '''
set -e
python -m pyjs_test_driver build-page pyodide --pyodide-version {{ version }} --packages numpy \
    --cache-dir build_root/pyodide --out build_root/pages/pyodide
python -m pyjs_test_driver run build_root/pages/pyodide --label "bench pyodide {{ version }}" --entry benchmarks \
    --browser {{ browsers }} --mode {{ modes }} --option "filter={{ filter }}" \
    --result-json build_root/benchmarks/pyodide/$(date +%Y%m%d-%H%M%S)_{browser}_{mode}.json \
    --meta wasm_type=pyodide-{{ version }} --meta timestamp=$(date +%Y%m%d-%H%M%S)
'''

# the npm package next to the html (the playground loads it) + the
# playground's packages pinned at build time (no solver in the browser)
[tasks.docs]
description = "The npm package + the sphinx docs: docs [out dir]"
args = [{ arg = "out", default = "build_root/docs_html" }]
depends-on = [{ task = "npm-package", args = ["wasm32 wasm64"] }]
env = { PYJS_DOCS_EXTRA_DIR = "$PIXI_PROJECT_ROOT/build_root/docs_extra" }
cmd = '''
set -e
rm -rf build_root/docs_extra {{ out }}
mkdir -p build_root/docs_extra
cp -r build_root/npm/package build_root/docs_extra/pyjs
node build_root/docs_extra/pyjs/bin/pyjs.mjs lock numpy -o build_root/docs_extra/pyjs-lock.json
sphinx-build -b html docs {{ out }}
echo "docs: {{ out }}/index.html"
'''

# Writing docs: rebuild on every change (docs/, docstrings in module/ and
# stubs/) and serve with live reload at http://127.0.0.1:<port>. Only sphinx:
# no npm package build. The playground and the run buttons use the package of
# the last `pixi run docs` (build_root/docs_extra) if there is one.
[tasks.docs-serve]
description = "Sphinx docs with rebuild on change + live reload: docs-serve [port]"
args = [{ arg = "port", default = "8000" }]
env = { PYJS_DOCS_EXTRA_DIR = "$PIXI_PROJECT_ROOT/build_root/docs_extra" }
# -E: every rebuild reads all pages again. Sphinx does not know that
# python_api.md shows the docstrings of module/ (autoapi directives): without
# it a docstring change triggers a build that rewrites nothing.
cmd = "sphinx-autobuild -E docs build_root/docs_live --watch module --watch stubs --port {{ port }}"

[tasks.clean]
description = "Delete build_root/ (the environments in .pixi/ stay)"
cmd = "rm -rf build_root"
